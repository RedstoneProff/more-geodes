
allprojects {
    group = maven_group
    version = mod_version
}

def targetProjects = file('enabled-targets.txt').readLines()
    .collect { it.trim() }.findAll { it && !it.startsWith('#') }.collect { ":${it}" }

tasks.register('buildAll') {
    group = 'build'
    description = 'Builds every target jar into dist/<mc>-<loader>/'
    dependsOn targetProjects.collect { "${it}:build" }
    doLast {
        targetProjects.each { tp ->
            def p = project(tp)
            def distDir = rootProject.layout.projectDirectory.dir("dist/${p.ext.mc}-${p.ext.loader}")
            copy {
                from(p.tasks.named(p.ext.distTask))
                into(distDir)
            }
        }
    }
}

tasks.register('verifyAll') {
    group = 'verification'
    description = 'Runs unit tests + JaCoCo XML + server GameTests for every target'
    dependsOn targetProjects.collect { "${it}:test" }
    dependsOn targetProjects.collect { "${it}:jacocoTestReport" }
    dependsOn targetProjects.collect { "${it}:runGametest" }
}
