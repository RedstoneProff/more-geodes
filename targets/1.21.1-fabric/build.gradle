
import groovy.xml.XmlParser
import groovy.xml.XmlNodePrinter

plugins {
    // obfuscated Minecraft versions use the remap plugin; 26.x is unobfuscated
    id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
}

ext {
    mc = '1.21.1'
    loader = 'fabric'
    distTask = 'remapJar'
}

base {
    archivesName = "${archives_base_name}-${project.ext.loader}-${project.ext.mc}"
}

configurations {
    gametestJacocoAgent
}

dependencies {
    gametestJacocoAgent 'org.jacoco:org.jacoco.agent:0.8.13:runtime'
}

sourceSets {
    gametest {
        compileClasspath += sourceSets.main.compileClasspath
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.runtimeClasspath
        runtimeClasspath += sourceSets.main.output
    }
}

loom {
    mods {
        "geodes" {
            sourceSet sourceSets.main
        }
        "geodes_gametest" {
            sourceSet sourceSets.gametest
        }
    }

    runs {
        gametest {
            inherit server
            name "GameTest Server"
            source sourceSets.gametest
            vmArg "-Dfabric-api.gametest=true"
            vmArg "-Dfabric-api.gametest.report-file=${layout.buildDirectory.get().asFile.absolutePath}/gametest-results/gametest.xml"
            vmArg "-Xms256m"
            vmArg "-Xmx768m"
            runDir "build/gametest-run"
            ideConfigGenerated false
            vmArg "-javaagent:${configurations.gametestJacocoAgent.singleFile.absolutePath}=destfile=${layout.buildDirectory.get().asFile.absolutePath}/jacoco/gametest.exec,append=false,dumponexit=true"
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    // the gametest API is a separate module from 1.21.1; 2.0.5 matches the resource-loader version fabric-api 0.115.1 ships
    modImplementation "net.fabricmc.fabric-api:fabric-gametest-api-v1:2.0.5+6fc22b9919"
}

sourceSets.main.java.srcDir '../../src/main/java'
sourceSets.main.java.srcDir '../../src/versions/1.21.1/java'
sourceSets.main.java.srcDir '../../src/loader/fabric/java'
// the version sources also hold this version's NeoForge adapter classes
sourceSets.main.java.exclude 'com/github/thedeathlycow/moregeodes/neoforge/**'
sourceSets.main.resources.srcDir '../../src/main/resources'
sourceSets.main.resources.srcDir '../../src/versions/1.21.1/resources'
sourceSets.test.java.srcDir '../../src/test/java'
sourceSets.test.java.srcDir 'src/test/java'

dependencies {
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = 'UTF-8'
    it.options.release = 21
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    withSourcesJar()
}

test {
    useJUnitPlatform()
    systemProperty 'geodes.test.mc', project.ext.mc
}

apply plugin: 'jacoco'

jacoco {
    toolVersion = '0.8.13'
}

jacocoTestReport {
    dependsOn test
    dependsOn tasks.named('runGametest')
    executionData fileTree(dir: layout.buildDirectory.dir('jacoco'), include: '*.exec')
    // client-only classes never run on the dedicated GameTest server
    classDirectories.setFrom(
            files(classDirectories.collect { dir ->
                fileTree(dir: dir, exclude: [
                        'com/github/thedeathlycow/moregeodes/client/**',
                        'com/github/thedeathlycow/moregeodes/fabric/MoreGeodesFabricClient*',
                        'com/github/thedeathlycow/moregeodes/item/GeodesItemGroup*'
                ])
            })
    )
    reports {
        xml.required = true
        html.required = true
    }
}

processResources {
    def version = project.version
    inputs.property "version", version

    filesMatching("fabric.mod.json") {
        expand "version": version
    }
}

jar {
    from(rootProject.file('LICENSE')) {
        rename { "${it}_geodes" }
    }
}

// the fabric-gametest reporter nests <testcase> inside an inner <testsuite>; flatten it to a standard JUnit file
tasks.register('fixupGametestReport') {
    doLast {
        def report = layout.buildDirectory.file('gametest-results/gametest.xml').get().asFile
        if (!report.exists()) {
            return
        }
        def root = new XmlParser(false, false).parse(report)
        def cases = root.depthFirst().findAll { it.name() == 'testcase' }
        def suiteAttrs = root.depthFirst().findAll { it.name() == 'testsuite' }
            .collectMany { it.attributes().entrySet() }
            .findAll { it.key in ['time', 'timestamp'] }
            .findAll { it.value != null && it.value != '0' }
            .collectEntries { [it.key, it.value] }
        def count = { String tag -> cases.count { it.children().any { it instanceof Node && it.name() == tag } } }
        def out = new Node(null, 'testsuite', [
            name    : 'fabric-gametest-api',
            time    : (suiteAttrs['time'] ?: '0'),
            timestamp: (suiteAttrs['timestamp'] ?: ''),
            tests   : cases.size(),
            failures: count('failure'),
            errors  : count('error'),
            skipped : count('skipped')
        ])
        cases.each { tc ->
            def copy = new Node(out, 'testcase', tc.attributes())
            tc.children().each { c ->
                if (c instanceof Node) {
                    def cc = new Node(copy, c.name(), c.attributes())
                    c.children().each { t -> cc.append(t) }
                } else {
                    copy.append(c)
                }
            }
        }
        def writer = new PrintWriter(new BufferedWriter(new FileWriter(report)))
        writer.println('<?xml version="1.0" encoding="UTF-8" standalone="no"?>')
        new XmlNodePrinter(writer).print(out)
        writer.close()
    }
}

tasks.named('runGametest') {
    finalizedBy 'fixupGametestReport'
}
