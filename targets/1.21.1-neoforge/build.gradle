// NeoForge runs Mojang names at runtime, so the plain jar is the distributable

import org.apache.tools.ant.filters.ReplaceTokens

plugins {
	id 'net.neoforged.moddev' version '2.0.148'
}

configurations {
	gametestJacocoAgent
}

dependencies {
	gametestJacocoAgent 'org.jacoco:org.jacoco.agent:0.8.13:runtime'
}

ext {
	mc = '1.21.1'
	loader = 'neoforge'
	distTask = 'jar'
}

base {
    archivesName = "${archives_base_name}-${project.ext.loader}-${project.ext.mc}"
}

sourceSets {
	gametest {
		compileClasspath += sourceSets.main.compileClasspath
		compileClasspath += sourceSets.main.output
		runtimeClasspath += sourceSets.main.runtimeClasspath
		runtimeClasspath += sourceSets.main.output
	}
	test {
		compileClasspath += sourceSets.main.compileClasspath
		compileClasspath += sourceSets.main.output
		runtimeClasspath += sourceSets.main.runtimeClasspath
		runtimeClasspath += sourceSets.main.output
	}
}

neoForge {
	version = "${neoforge_version}"

	mods {
		"geodes" {
			sourceSet sourceSets.main
		}
		"geodes_gametest" {
			sourceSet sourceSets.gametest
		}
	}

	runs {
		client {
			client()
		}

		gametest {
			type = 'gameTestServer'
			gameDirectory = file('build/gametest-run')
			// the test methods use geodes-test template ids, so both namespaces must be enabled
			systemProperty 'neoforge.enabledGameTestNamespaces', 'geodes,geodes-test'
			systemProperty 'geodes.gametest.report',
				layout.buildDirectory.file('gametest-results/gametest.xml').get().asFile.absolutePath
			jvmArgument "-javaagent:${configurations.gametestJacocoAgent.singleFile.absolutePath}=destfile=${layout.buildDirectory.get().asFile.absolutePath}/jacoco/gametest.exec,append=false,dumponexit=true"
		}
	}
}

// dev runs look for test structures flat in <gameDirectory>/gameteststructures
def gametestStructures = tasks.register('gametestStructures', Copy) {
	from('src/gametest/resources/data/geodes-test/gametest/structure') {
		include '*.snbt'
	}
	into layout.buildDirectory.dir('gametest-run/gameteststructures')
}

tasks.matching { it.name == 'prepareGametestRun' }.configureEach {
	dependsOn gametestStructures
}

tasks.matching { it.name == 'runGametest' }.configureEach {
	doLast {
		def report = layout.buildDirectory.file('gametest-results/gametest.xml').get().asFile
		if (!report.isFile()) {
			throw new GradleException("GameTest report missing: ${report} (GametestXmlReporter did not run?)")
		}
		def factory = javax.xml.parsers.DocumentBuilderFactory.newInstance()
		factory.setFeature('http://apache.org/xml/features/disallow-doctype-decl', true)
		def doc = factory.newDocumentBuilder().parse(report)
		def testsuite = doc.documentElement
		def num = { String attr ->
			def v = testsuite.getAttribute(attr)
			v == null || v.isEmpty() ? 0 : v.toInteger()
		}
		def total = num('tests')
		def failures = num('failures')
		def errors = num('errors')
		def skipped = num('skipped')
		if (failures != 0 || errors != 0 || skipped != 0) {
			throw new GradleException("GameTests failed: ${failures} failures, ${errors} errors, ${skipped} skipped (see ${report})")
		}
		if (total < 1) {
			throw new GradleException("GameTest report has ${total} tests, expected at least one (see ${report})")
		}
		logger.lifecycle("GameTests OK: ${total} tests, 0 failures (${report})")
	}
}

sourceSets.main.java.srcDir '../../src/main/java'
sourceSets.main.java.srcDir '../../src/versions/1.21.1/java'
sourceSets.main.resources.srcDir '../../src/main/resources'
sourceSets.main.resources.srcDir '../../src/versions/1.21.1/resources'
sourceSets.test.java.srcDir '../../src/test/java'
sourceSets.test.java.srcDir 'src/test/java'

// 1.21.1 compiles its own MoreGeodesNeoForge (src/main/java) instead of the shared one
def stageLoaderJava = tasks.register('stageLoaderJava', Copy) {
	from '../../src/loader/neoforge/java'
	exclude 'com/github/thedeathlycow/moregeodes/neoforge/MoreGeodesNeoForge.java'
	into layout.buildDirectory.dir('loader-staged-java')
}
sourceSets.main.java.srcDir stageLoaderJava

// Fabric-only client classes are not part of the NeoForge build
sourceSets.main.java.exclude '**/fabric/**'
sourceSets.main.java.exclude '**/mixin/client/ItemColorsMixin.java'
sourceSets.main.java.exclude '**/client/ItemColorsSetup.java'

dependencies {
	testImplementation platform('org.junit:junit-bom:5.11.4')
	testImplementation 'org.junit.jupiter:junit-jupiter'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
	it.options.encoding = 'UTF-8'
	it.options.release = 21
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
	withSourcesJar()
}

test {
	useJUnitPlatform()
	systemProperty 'geodes.test.mc', project.ext.mc
}

apply plugin: 'jacoco'

jacoco {
	toolVersion = '0.8.13'
}

jacocoTestReport {
	dependsOn test
	dependsOn tasks.named('runGametest')
	executionData fileTree(dir: layout.buildDirectory.dir('jacoco'), include: '*.exec')
	// client-only classes never run on the dedicated GameTest server
	classDirectories.setFrom(
			files(classDirectories.collect { dir ->
				fileTree(dir: dir, exclude: [
						'com/github/thedeathlycow/moregeodes/client/**',
						'com/github/thedeathlycow/moregeodes/neoforge/client/**',
						'com/github/thedeathlycow/moregeodes/item/GeodesItemGroup*'
				])
			})
	)
	reports {
		xml.required = true
		html.required = true
	}
}

tasks.withType(ProcessResources).configureEach {
	def version = project.version
	inputs.property "version", version

	// ReplaceTokens rather than expand(): a stray $ in the TOML breaks the template engine
	filesMatching("META-INF/neoforge.mods.toml") {
		filter ReplaceTokens, beginToken: '${', endToken: '}', tokens: [version: version]
	}
}

jar {
	from(rootProject.file('LICENSE')) {
		rename { "${it}_geodes" }
	}
}
